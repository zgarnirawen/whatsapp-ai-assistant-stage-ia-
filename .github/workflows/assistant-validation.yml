name: Assistant validation

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/e2e-test-plan-4180.md"
      - "docs/speech-to-text-test-plan-4176.md"
      - ".github/workflows/assistant-validation.yml"
  workflow_dispatch:

jobs:
  backend-build-and-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Run offline fallback regression suite
        run: npx tsx src/services/fallbackRegressionCheck.ts
      - name: Run offline intent recognition regression suite
        run: npx tsx src/services/intentRecognitionRegressionCheck.ts
      - name: Validate speech-to-text integration contract
        run: npx tsx src/services/speechToTextValidationCheck.ts
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: assistant-regression-reports
          path: |
            backend/test-results/fallback-report.json
            backend/test-results/intent-recognition-report.json
          if-no-files-found: error

  e2e:
    if: ${{ vars.E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_TIMEOUT_MS: ${{ secrets.E2E_TIMEOUT_MS || '15000' }}
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: assistant-e2e-report
          path: backend/test-results/e2e-report.json
          if-no-files-found: ignore
